name: Deploy to GitHub Pages

# Kostenlos, weil das Repository oeffentlich ist: Actions sind dann unbegrenzt
# inklusive der monatlichen Minuten. Private Repos rechnen nach Nutzungsdauer ab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub erlaubt hoechstens eine gleichzeitige Veroeffentlichung. Laeuft eine
# neuere, wird die aeltere abgebrochen, damit nie ein aelterer Build live geht.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typen pruefen
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm exec vitest run

      # GitHub Pages laeuft unter /yalla-quest/, nicht an der Domainwurzel.
      # base in vite.config.ts bekommt den Wert daher aus dieser Variable.
      - name: Bauen
        env:
          BASE_PATH: /yalla-quest/
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
