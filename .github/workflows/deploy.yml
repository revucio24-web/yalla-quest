name: CI und Veroeffentlichung

# Oeffentliches Repository: GitHub Actions rechnet hier keine Minuten ab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur Lesen. Die Berechtigungen fuer GitHub Pages (pages: write,
# id-token: write) sind entfernt, seit die Veroeffentlichung ueber
# Cloudflare laeuft. Wer sie nicht braucht, sollte sie nicht erhalten.
permissions:
  contents: read

# Hoechstens ein Lauf gleichzeitig. Startet ein neuer, wird der alte
# abgebrochen, damit nie ein aelterer Build live geht.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    name: Typen, Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typen pruefen
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm exec vitest run

      - name: Lint
        run: pnpm exec eslint .

      # Cloudflare liefert an der Domainwurzel aus, deshalb bleibt BASE_PATH
      # leer. Fuer einen Hoster im Unterpfad hier /projektname/ eintragen.
      - name: Bauen
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Cloudflare Pages
    needs: build
    # Auto-Deploy laesst sich mit der Repository-Variable
    # CLOUFFLARE_DEPLOY=false abschalten, ohne die Datei zu aendern.
    if: ${{ vars.CLOUDFLARE_DEPLOY != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: dist aus dem Build laden
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Ohne hinterlegtes Token ueberspringen wir nur diesen Schritt, der
      # Lauf bleibt gruen. Sobald das Secret existiert, greift der Schritt
      # bei jedem Push automatisch.
      - name: Nach Cloudflare Pages veroeffentlichen
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 766659b5f1eadc617c87f03cd8358eed
          command: pages deploy dist --project-name=yalla-quest --branch=main
